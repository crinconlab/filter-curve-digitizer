name: Build macOS Apple Silicon APP (PyInstaller)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-apple-silicon:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m py_compile Filter_Curve_Digitizer.py
          python -c "import tkinter, numpy, PIL; print('Tkinter, NumPy, Pillow: OK')"
          python -c "import platform; arch=platform.machine(); print('CPU:',arch); assert arch == 'arm64', f'Expected arm64, got {arch}'"

      - name: Convert existing project icon for macOS
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open("Filter_Curve_Digitizer.ico")
          image.save("app-icon.png")
          print("Icon PNG:", image.size)
          PY
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" app-icon.png --out "app.iconset/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 128 256 512; do
            d=$((s * 2))
            sips -z "$d" "$d" app-icon.png --out "app.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns app.iconset -o Filter_Curve_Digitizer.icns

      - name: Bundle Apple Silicon macOS app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --target-arch arm64 \
            --name "Filter Curve Digitizer" \
            --icon Filter_Curve_Digitizer.icns \
            --osx-bundle-identifier com.crinconlab.filtercurvedigitizer \
            Filter_Curve_Digitizer.py
          test -d "dist/Filter Curve Digitizer.app"
          file "dist/Filter Curve Digitizer.app/Contents/MacOS/Filter Curve Digitizer"
          lipo -archs "dist/Filter Curve Digitizer.app/Contents/MacOS/Filter Curve Digitizer" | grep -w arm64

      - name: Package app as ZIP (preserve macOS bundle metadata)
        run: |
          cd dist
          ditto -c -k --keepParent "Filter Curve Digitizer.app" "Filter-Curve-Digitizer-macOS-AppleSilicon-v1.3b.zip"
          unzip -t "Filter-Curve-Digitizer-macOS-AppleSilicon-v1.3b.zip" >/dev/null

      - name: Upload private artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filter-Curve-Digitizer-macOS-AppleSilicon-v1.3b
          path: dist/Filter-Curve-Digitizer-macOS-AppleSilicon-v1.3b.zip
          if-no-files-found: error
          retention-days: 14
