name: Build Windows EXE (Nuitka)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Filter_Curve_Digitizer.py'
      - 'requirements.txt'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies and Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard
      - name: Check source syntax and imports
        shell: pwsh
        run: |
          python -m py_compile Filter_Curve_Digitizer.py
          python -c "import tkinter,numpy,PIL; print('GUI dependencies OK')"
      - name: Compile GUI executable
        shell: pwsh
        run: |
          python -m nuitka --mode=onefile --assume-yes-for-downloads --enable-plugin=tk-inter --windows-console-mode=disable --output-filename=Filter_Curve_Digitizer.exe Filter_Curve_Digitizer.py
      - name: Upload Windows executable (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Filter-Curve-Digitizer-Windows-x64
          path: Filter_Curve_Digitizer.exe
          if-no-files-found: error
          retention-days: 14
