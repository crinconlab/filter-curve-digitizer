name: Validate v1.4 development
on:
  push:
    branches:
      - develop/v1.4-onboarding-updates
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile Filter_Curve_Digitizer.py linux_launcher.py tests/test_v14.py
      - run: python -m unittest discover -s tests -p 'test_v14.py'
