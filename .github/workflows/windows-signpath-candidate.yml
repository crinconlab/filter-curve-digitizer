name: Windows signing candidate (SignPath)

on:
  workflow_dispatch:
    inputs:
      request_signing:
        description: Request signing after SignPath admission and configuration
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: signpath-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'crinconlab/filter-curve-digitizer' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      REQUEST_SIGNING: ${{ inputs.request_signing }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check signing prerequisites
        if: inputs.request_signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNPATH_ENABLED -ne 'true') { throw 'Production signing is not enabled.' }
          foreach ($key in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG','SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) { throw "Missing setting: $key" }
          }
      - name: Install and record build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -m pip freeze > evidence/dependencies.txt
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Validate source and run regression tests
        shell: pwsh
        run: |
          python -m py_compile Filter_Curve_Digitizer.py update_download.py
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          $version = python -c "import Filter_Curve_Digitizer as app; print(app.APP_VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric stable application version.' }
          "APP_FILE_VERSION=$version.0" >> $env:GITHUB_ENV
      - name: Compile candidate with product metadata
        shell: pwsh
        run: |
          python -m nuitka --mode=onefile --assume-yes-for-downloads --enable-plugin=tk-inter --windows-console-mode=disable --windows-icon-from-ico=Filter_Curve_Digitizer.ico --product-name="Filter Curve Digitizer" --company-name="Carlos Rincon" --product-version="$env:APP_FILE_VERSION" --file-version="$env:APP_FILE_VERSION" --file-description="Filter Curve Digitizer" --copyright="Copyright Carlos Rincon 2026" --report=evidence/compilation-report.xml --output-filename=Filter-Curve-Digitizer-Windows-x64.exe Filter_Curve_Digitizer.py
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka compilation failed.' }
          $info = (Get-Item Filter-Curve-Digitizer-Windows-x64.exe).VersionInfo
          if ($info.ProductName -ne 'Filter Curve Digitizer' -or $info.CompanyName -ne 'Carlos Rincon') { throw 'Unexpected product identity.' }
          $info | Format-List * | Out-File evidence/version-info.txt
          Get-FileHash Filter-Curve-Digitizer-Windows-x64.exe -Algorithm SHA256 | Format-List | Out-File evidence/unsigned-sha256.txt
      - name: Upload unsigned executable for origin verification
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Filter-Curve-Digitizer-unsigned-candidate
          path: Filter-Curve-Digitizer-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Submit for manually approved SignPath signing
        if: inputs.request_signing
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-candidate
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: signed
          parameters: |
            version: "${{ env.APP_FILE_VERSION }}"
      - name: Verify signed candidate and timestamp
        if: inputs.request_signing
        shell: pwsh
        run: |
          $file = 'signed/Filter-Curve-Digitizer-Windows-x64.exe'
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($signature.Status)" }
          if (-not $signature.TimeStamperCertificate) { throw 'Missing timestamp certificate.' }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw 'Unexpected signing publisher.' }
          $signature | Format-List * | Out-File evidence/signature.txt
          Get-FileHash $file -Algorithm SHA256 | Format-List | Out-File evidence/signed-sha256.txt
      - name: Save signed candidate for separate antivirus review
        if: inputs.request_signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Filter-Curve-Digitizer-signed-review-candidate
          path: signed/Filter-Curve-Digitizer-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Filter-Curve-Digitizer-signing-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

